name: Migrate Secrets from Cloud Supabase to Railway

on:
  workflow_dispatch:

jobs:
  migrate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy secret-exporter to Cloud Supabase
        run: |
          supabase functions deploy secret-exporter --project-ref cyygmyiqgdzgeoayxbro --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Fetch secrets from Cloud Supabase
        id: fetch-secrets
        run: |
          sleep 5
          SECRETS=$(curl -fsS https://cyygmyiqgdzgeoayxbro.supabase.co/functions/v1/secret-exporter)
          echo "SECRETS_JSON=$SECRETS" >> $GITHUB_ENV

      - name: Delete secret-exporter from Cloud Supabase
        if: always()
        run: |
          supabase functions delete secret-exporter --project-ref cyygmyiqgdzgeoayxbro || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Save secrets to Railway Postgres
        run: |
          npm install --no-save pg
          node scripts/save-exported-secrets.mjs
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
