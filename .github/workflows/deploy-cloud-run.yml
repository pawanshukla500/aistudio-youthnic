name: Deploy web app to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'youthnic-ai-studio' }}
  REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'cloud-run' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint application
        run: npm run lint

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Verify catalog workflow contract
        run: node scripts/verify-catalog-workflow-v2.mjs

      - name: Validate live acceptance harness
        run: node --check scripts/verify-catalog-workflow-live.mjs

      - name: Test catalog workflow utilities
        run: deno test --frozen supabase/functions/app-api/lib/catalogHandoffCalendar.test.ts supabase/functions/app-api/lib/catalogStageTimeline.test.ts supabase/functions/app-api/lib/catalogRecipientSelection.test.ts supabase/functions/app-api/tests/ai_model_policy.test.ts supabase/functions/app-api/tests/fashion_knowledge.test.ts supabase/functions/app-api/tests/learning_rules.test.ts supabase/functions/app-api/tests/prompt_patterns.test.ts supabase/functions/app-api/tests/generation_memory.test.ts supabase/functions/app-api/tests/reference_policy.test.ts supabase/functions/app-api/tests/saree_profiles.test.ts supabase/functions/app-api/tests/garment_poses.test.ts supabase/functions/app-api/tests/showcase_feature.test.ts supabase/functions/app-api/tests/evidence_prompt.test.ts supabase/functions/app-api/tests/catalog_token_optimization.test.ts supabase/functions/app-api/tests/generation_runs.test.ts supabase/functions/app-api/tests/qa_fidelity.test.ts supabase/functions/app-api/tests/admin_ai_routing.test.ts supabase/functions/app-api/tests/invoke_error_message.test.ts supabase/functions/app-api/tests/provider_cost.test.ts && deno test --frozen --allow-read=supabase/functions/app-api/index.ts,src,supabase/migrations supabase/functions/app-api/tests/entrypoint_source.test.ts supabase/functions/app-api/tests/image_routing.test.ts supabase/functions/app-api/tests/duplicate_queue.test.ts

      - name: Validate catalog migration SQL
        run: npm run validate:catalog-sql

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify database types sync
        run: |
          if [ -n "${{ secrets.RAILWAY_DATABASE_URL }}" ]; then
            supabase gen types typescript --db-url "${{ secrets.RAILWAY_DATABASE_URL }}" > generated.types.ts
          elif [ -n "${{ vars.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            supabase gen types typescript --project-id ${{ vars.SUPABASE_PROJECT_REF }} > generated.types.ts
          else
            echo "Skipping remote type generation check (no credentials provided)."
            exit 0
          fi
          if ! diff -q -B -w src/database.types.ts generated.types.ts >/dev/null 2>&1; then
            echo "::error::Supabase types are out of sync! The database schema has changed but src/database.types.ts was not updated."
            diff -u -B -w src/database.types.ts generated.types.ts | head -n 100 || true
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

      - name: Type-check application Edge Function
        run: deno check --frozen supabase/functions/app-api/index.ts

      - name: Build application
        run: node scripts/verify-client-config.mjs && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_FUNCTIONS_URL: ${{ secrets.VITE_SUPABASE_FUNCTIONS_URL }}

  deploy-supabase:
    name: Deploy Supabase database and Edge Function
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations to Railway Postgres
        if: env.RAILWAY_DATABASE_URL != ''
        run: |
          supabase db push --db-url "$RAILWAY_DATABASE_URL"

      - name: Link legacy Supabase project (fallback)
        if: env.RAILWAY_DATABASE_URL == '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Repair remote migration history (legacy)
        if: env.RAILWAY_DATABASE_URL == '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase migration repair --status reverted 20260730160238 20260730160242 20260730161513 20260801110407 20260801154448 20260801155825 20260801160311 20260801160534 20260802072834 20260802084640 20260802085604 20260802093311 20260802093314 20260802093404 20260802093407 --linked || true

      - name: Preview pending migrations (legacy)
        if: env.RAILWAY_DATABASE_URL == '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase db push --linked --dry-run

      - name: Apply database migrations (legacy)
        if: env.RAILWAY_DATABASE_URL == '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase db push --linked

      - name: Deploy application Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy app-api --project-ref "$SUPABASE_PROJECT_REF" --use-api || true

  test-and-deploy:
    name: Deploy web app to Cloud Run
    needs: [deploy-supabase]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Create Artifact Registry repository if missing
        run: gcloud artifacts repositories create "$REPOSITORY" --repository-format=docker --location="$REGION" --description="Docker repository" || true

      - uses: docker/setup-buildx-action@v4

      - id: image
        name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CACHE_BUSTER=${{ github.run_id }}-${{ github.sha }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
            VITE_SUPABASE_FUNCTIONS_URL=${{ secrets.VITE_SUPABASE_FUNCTIONS_URL }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --min-instances=0
            --max-instances=3
            --timeout=60s
            --cpu-throttling
            --execution-environment=gen2

      - name: Verify deployed health
        run: curl --fail --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/"
