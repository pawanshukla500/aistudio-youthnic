name: Migrate Supabase Cloud to Railway

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Dump from Supabase Cloud and Restore to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Link to Supabase Cloud
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Dump schema from Supabase Cloud
        run: |
          echo "Dumping schema..."
          supabase db dump --project-ref "$SUPABASE_PROJECT_REF" -f schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Dump data from Supabase Cloud
        run: |
          echo "Dumping data..."
          supabase db dump --project-ref "$SUPABASE_PROJECT_REF" --data-only --use-copy -f data.sql || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Upload dumps as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supabase-cloud-export
          path: |
            schema.sql
            data.sql

      - name: Apply schema to Railway Postgres
        run: |
          echo "Applying schema to Railway..."
          psql "${{ secrets.RAILWAY_DATABASE_URL }}" -v ON_ERROR_STOP=0 -f schema.sql

      - name: Apply data to Railway Postgres
        run: |
          if [ -f data.sql ] && [ -s data.sql ]; then
            echo "Applying data to Railway..."
            psql "${{ secrets.RAILWAY_DATABASE_URL }}" -v ON_ERROR_STOP=0 -f data.sql
          fi

      - name: Push pending repository migrations to Railway Postgres
        run: |
          echo "Syncing repository migrations..."
          supabase db push --db-url "${{ secrets.RAILWAY_DATABASE_URL }}" --include-all || true

      - name: Verify Railway Postgres table counts
        run: |
          psql "${{ secrets.RAILWAY_DATABASE_URL }}" -c "
            SELECT schemaname, tablename 
            FROM pg_tables 
            WHERE schemaname IN ('public', 'private')
            ORDER BY schemaname, tablename;
          "
          psql "${{ secrets.RAILWAY_DATABASE_URL }}" -c "
            SELECT 'organizations' as tbl, count(*) from public.organizations
            UNION ALL
            SELECT 'organization_members', count(*) from public.organization_members
            UNION ALL
            SELECT 'planning_batches', count(*) from public.planning_batches
            UNION ALL
            SELECT 'catalog_sessions', count(*) from public.catalog_sessions
            UNION ALL
            SELECT 'fashion_knowledge_base', count(*) from public.fashion_knowledge_base;
          "
